name: Volcengine Coding Plan Prewarm

on:
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "0 13 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcengine-coding-plan-prewarm
  cancel-in-progress: false

jobs:
  prewarm:
    name: Trigger five-hour window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VOLCENGINE_CODING_PLAN_API_KEY: ${{ secrets.VOLCENGINE_CODING_PLAN_API_KEY }}
      VOLCENGINE_CODING_PLAN_MODEL: ${{ vars.VOLCENGINE_CODING_PLAN_MODEL || 'ark-code-latest' }}
    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VOLCENGINE_CODING_PLAN_API_KEY}" ]]; then
            echo "Missing repository secret VOLCENGINE_CODING_PLAN_API_KEY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run shared automation task
        run: node automation/local/run-task.mjs --task volcengine-prewarm
