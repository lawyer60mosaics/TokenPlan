name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows executable
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release executable
        run: npm run tauri -- build

      - name: Prepare artifact and checksum
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/volcengine-token-plan.exe"
          if (-not (Test-Path -LiteralPath $source)) { throw "Windows executable was not generated" }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination "release/TokenPlan-Windows.exe"
          (Get-FileHash -LiteralPath "release/TokenPlan-Windows.exe" -Algorithm SHA256).Hash + "  TokenPlan-Windows.exe" | Set-Content -LiteralPath "release/TokenPlan-Windows.exe.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenPlan-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
