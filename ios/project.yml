name: TokenPlan
options:
  bundleIdPrefix: com.xuwenxu
  deploymentTarget:
    iOS: "16.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  TokenPlan:
    type: application
    platform: iOS
    sources:
      - path: TokenPlan
    dependencies:
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TokenPlan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TokenPlanTests
  TokenPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TokenPlanTests
    dependencies:
      - target: TokenPlan
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan.tests
        GENERATE_INFOPLIST_FILE: YES
