name: TokenPlan
options:
  bundleIdPrefix: com.xuwenxu
  deploymentTarget:
    iOS: "16.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.3.0
targets:
  TokenPlan:
    type: application
    platform: iOS
    sources:
      - path: TokenPlan
      - path: Shared
    dependencies:
      - package: Sodium
      - target: TokenPlanWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TokenPlan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CODE_SIGN_ENTITLEMENTS: TokenPlan/TokenPlan.entitlements
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TokenPlanTests
  TokenPlanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: TokenPlanWidgets
      - path: Shared
    info:
      path: TokenPlanWidgets/Info.plist
      properties:
        CFBundleDisplayName: TokenPlan 小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan.widgets
        CODE_SIGN_ENTITLEMENTS: TokenPlanWidgets/TokenPlanWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  TokenPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TokenPlanTests
    dependencies:
      - target: TokenPlan
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan.tests
        GENERATE_INFOPLIST_FILE: YES
