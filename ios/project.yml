name: TokenPlan
options:
  bundleIdPrefix: com.xuwenxu
  deploymentTarget:
    iOS: "16.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.6.0
targets:
  TokenPlan:
    type: application
    platform: iOS
    sources:
      - path: TokenPlan
      - path: Shared
    info:
      path: TokenPlan/Info.plist
      properties:
        CFBundleDisplayName: TokenPlan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.xuwenxu.tokenplan
            CFBundleURLSchemes:
              - tokenplan
        LSApplicationCategoryType: public.app-category.utilities
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        BGTaskSchedulerPermittedIdentifiers:
          - com.xuwenxu.tokenplan.refresh
        UIBackgroundModes:
          - fetch
        NSSupportsLiveActivities: true
    dependencies:
      - package: Sodium
      - target: TokenPlanWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TokenPlan/TokenPlan.entitlements
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TokenPlanTests
  TokenPlanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: TokenPlanWidgets
      - path: Shared
    info:
      path: TokenPlanWidgets/Info.plist
      properties:
        CFBundleDisplayName: TokenPlan 小组件
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan.widgets
        CODE_SIGN_ENTITLEMENTS: TokenPlanWidgets/TokenPlanWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  TokenPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TokenPlanTests
    dependencies:
      - target: TokenPlan
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuwenxu.tokenplan.tests
        GENERATE_INFOPLIST_FILE: YES
