limit_req_zone $binary_remote_addr zone=tokenplan_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tokenplan.xuwenxu.com;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tokenplan.xuwenxu.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tokenplan.xuwenxu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenplan.xuwenxu.com/privkey.pem;
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_except GET PUT { deny all; }
        limit_req zone=tokenplan_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        default_type application/json;
        return 200 '{"service":"TokenPlan Sync API","status":"ok"}';
    }
}
